<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odyssey: night walking routes, Southampton</title>
<meta name="description" content="Compare walking routes home after dark in Southampton, with the evidence behind every rating.">
<meta name="theme-color" content="#0E1726">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Odyssey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.4-3 8.3-7 9.5-4-1.2-7-5.1-7-9.5V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8.5v4.5M12 16v.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12.5v6.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4h10l-2 4 2 4H6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6.1 6.5-11.2A6.5 6.5 0 0 0 5.5 9.8C5.5 14.9 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.8" r="2.3" fill="currentColor"/></symbol>
    <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8" fill="currentColor"/><path d="M10 21l2-6 2.5 2.5V21M8 12l2.5-4.5 3.5 1 2 3.5M10.5 7.5L9 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 4v15M8 19l-3-3M8 19l3-3M16 20V5M16 5l-3 3M16 5l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="currentColor"/></symbol>
    <symbol id="logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#A5B4FC"/><circle cx="21.4" cy="11.5" r="9.3" fill="#0E1726"/><circle cx="23.5" cy="10" r="1.5" fill="#A5B4FC"/></symbol>
  </defs>
</svg>

<div id="splash" role="status" aria-live="polite">
  <svg class="splash-logo" aria-hidden="true"><use href="#logo"/></svg>
  <p class="splash-name">Odyssey</p>
  <p class="splash-msg" id="splash-msg">Loading Southampton’s walking paths</p>
  <div class="splash-bar"><span id="splash-bar"></span></div>
</div>

<div id="map" aria-label="Map of Southampton walking paths coloured by risk"></div>

<header id="topbar">
  <button class="round" id="btn-menu" aria-label="About Odyssey and data sources"><svg><use href="#i-menu"/></svg></button>
  <button class="pill" id="btn-tonight" aria-label="Tonight: live tide, flood warnings and data dates">
    <span class="live-dot" id="live-dot"></span><span id="tonight-label">Tonight</span>
  </button>
  <button class="round help" id="btn-help" aria-label="Help and emergency contacts"><svg><use href="#i-shield"/></svg><span>Help</span></button>
</header>

<div id="map-tools">
  <button class="round" id="btn-locate" aria-label="Show my location"><svg><use href="#i-locate"/></svg></button>
  <button class="round" id="btn-legend" aria-label="Show what the colours mean" aria-expanded="false">
    <span class="legend-swatches"><i class="sw low"></i><i class="sw medium"></i><i class="sw high"></i></span>
  </button>
</div>
<div id="legend" class="hidden" role="note">
  <p class="legend-title">Risk after dark</p>
  <span><i class="sw low"></i>Lower</span>
  <span><i class="sw medium"></i>Medium</span>
  <span><i class="sw high"></i>Higher</span>
  <span><i class="sw unknown"></i>Unknown: no lighting data</span>
  <span><i class="sw haven"></i>Staffed place</span>
</div>

<div id="pick-banner" class="hidden" role="status">
  <span id="pick-text">Tap the map to set your start</span>
  <button id="pick-cancel">Cancel</button>
</div>

<!-- main sheet: plan, search, results -->
<section id="sheet" aria-label="Plan a route">
  <div class="grabber" id="grabber" aria-hidden="true"><span></span></div>

  <div id="view-plan" class="view">
    <button class="search-field" id="open-search">
      <svg><use href="#i-search"/></svg><span>Where are you going?</span>
    </button>
    <div class="chips" id="quick-chips" aria-label="Popular destinations"></div>
    <div class="plan-extra">
      <div id="recent-wrap" class="hidden">
        <h3 class="section">Recent</h3>
        <div id="recent-list"></div>
      </div>
      <div class="honesty-card" id="honesty-card"></div>
    </div>
  </div>

  <div id="view-search" class="view hidden">
    <div class="trip-fields">
      <button class="trip-row" id="from-row" aria-label="Change start">
        <span class="trip-dot start"></span>
        <span class="trip-label">From</span>
        <span class="trip-value" id="from-value">My location</span>
      </button>
      <div class="trip-input-row">
        <span class="trip-dot end"></span>
        <label class="trip-label" for="dest">To</label>
        <input id="dest" type="search" placeholder="Street, place or postcode" autocomplete="off" enterkeyhint="search">
        <button class="icon-btn" id="search-close" aria-label="Close search"><svg><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div id="from-picker" class="hidden">
      <h3 class="section">Start from</h3>
      <div id="from-list"></div>
    </div>
    <p class="status" id="search-status" role="status"></p>
    <div id="suggestions" role="listbox" aria-label="Places"></div>
  </div>

  <div id="view-results" class="view hidden">
    <div class="results-head">
      <button class="icon-btn" id="results-back" aria-label="Back to search"><svg><use href="#i-back"/></svg></button>
      <div class="results-title">
        <p class="results-to" id="results-to"></p>
        <p class="results-from" id="results-from"></p>
      </div>
      <button class="icon-btn" id="btn-prefs" aria-label="Route preferences"><svg><use href="#i-sliders"/></svg></button>
    </div>
    <div class="cards" id="cards" role="list"></div>
    <div class="dots" id="card-dots" aria-hidden="true"></div>
    <div id="route-detail"></div>
  </div>
</section>

<!-- modal sheets -->
<div class="scrim hidden" id="scrim"></div>
<section class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-head">
    <h2 id="modal-title" tabindex="-1"></h2>
    <button class="icon-btn" id="modal-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</section>

<!-- first-run welcome -->
<section id="welcome" class="hidden" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
  <div class="welcome-inner">
    <svg class="welcome-logo" aria-hidden="true"><use href="#logo"/></svg>
    <div id="welcome-step"></div>
    <div class="welcome-dots" id="welcome-dots"></div>
    <div class="welcome-actions">
      <button class="btn primary" id="welcome-next">Continue</button>
      <button class="btn quiet" id="welcome-back">Back</button>
    </div>
  </div>
</section>

<div id="toast" role="status" aria-live="polite" class="hidden"><span id="toast-text"></span><button id="toast-action" class="hidden"></button></div>

<script src="vendor/leaflet.js"></script>
<script src="app.js?v=4"></script>
<script src="ui.js?v=4"></script>
</body>
</html>
